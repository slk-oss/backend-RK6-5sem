name: rk6-microservices

services:
  auth-db:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      POSTGRES_DB: restaurant_auth_db
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  product-db:
    image: postgres:16
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD in .env}
      POSTGRES_DB: restaurant_product_db
    volumes:
      - product_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_product_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-db:
    image: postgres:16
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      POSTGRES_DB: restaurant_order_db
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_order_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  auth_postgres_data:
  product_postgres_data:
  order_postgres_data:
  redis_data: